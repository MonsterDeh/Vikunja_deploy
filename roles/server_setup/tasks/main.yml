- name: Allow SSH through the firewall
  ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP through the firewall
  ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS through the firewall
  ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Enable UFW with a default-deny policy
  ufw:
    state: enabled
    policy: deny
