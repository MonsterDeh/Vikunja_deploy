services:
  nginx:
    image: ${NGINX_IMAGE}
    container_name: ${NGINX_CONTAINER_NAME}
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./nginx_config.txt:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_SSL_HOST_DIR}:/etc/nginx/ssl:ro
    restart: unless-stopped
    networks:
      - vikunja_net

networks:
  vikunja_net:
    name: ${DOCKER_NETWORK_NAME}
    external: true
