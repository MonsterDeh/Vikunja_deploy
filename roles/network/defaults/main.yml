---
# Defaults for the network role.

docker_network_name: "vikunja_net"
nginx_path_file: "/opt/nginx/"
nginx_server_name: "{{ vikunja_url_public | default('myapp.local') }}"
nginx_upstream_host: "vikunja"
nginx_upstream_port: 3456
nginx_http_port: 80
nginx_https_port: 443
nginx_image: "nginx:1.27-alpine"
nginx_container_name: "vikunja-nginx"
nginx_ssl_host_dir: "/etc/nginx/ssl"
nginx_ssl_container_dir: "/etc/nginx/ssl"
nginx_ssl_certificate: "{{ nginx_server_name }}.crt"
nginx_ssl_certificate_key: "{{ nginx_server_name }}.key"
nginx_ssl_generate_self_signed: true
nginx_ssl_valid_days: 365
nginx_compose_filename: "docker-compose-ngnix.yml"
