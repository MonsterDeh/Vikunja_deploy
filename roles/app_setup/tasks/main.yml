---
# tasks file for roles/app_setup

- name: Create root directory for Vikunja
  ansible.builtin.file:
    path: "{{vikunja_path_file}}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - install
    - deploy


- name: Create files directory for Vikunja attachments
  ansible.builtin.file:
    path: "{{vikunja_path_file}}/files"
    state: directory
    owner: 1000        
    group: 1000
    mode: '0750'         
  tags:
    - install
    - deploy



- name: Create db directory for PostgreSQL persistence
  ansible.builtin.file:
    path: "{{vikunja_path_file}}/db"
    state: directory
    owner: 999          
    group: 999
    mode: '0750'
  tags:
    - install
    - deploy


- name: Copy docker compose file
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: "{{vikunja_path_file}}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"    
  notify: Restart Vikunja
  tags:
    - install
    - deploy


- name: Render secret environment file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{vikunja_path_file}}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Vikunja
  tags:
    - install
    - deploy


- name: Run Docker compose of Vikunja
  community.docker.docker_compose_v2:
    project_src: "{{vikunja_path_file}}"
    state: present
  tags:
    - install
    - deploy
    - docker  

  
